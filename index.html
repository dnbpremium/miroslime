<head>

<style>
:root{--ink:#050507;--white:#f2f4f6;--ice:#a9bdd0;--line:#d6dbe0;--mute:#6f7782;--serif:'Instrument Serif',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--brut:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;background:var(--white);color:var(--ink);padding-bottom:70px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--ice);outline-offset:3px}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,4vw,56px);color:#fff;mix-blend-mode:difference}
.brand{font-family:var(--brut);font-size:1.4rem;letter-spacing:.2em;font-weight:900}
.cartbtn{font-size:.85rem;letter-spacing:.2em;display:flex;gap:12px;align-items:center}
.cartbtn b{font-weight:400;min-width:22px;height:22px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:.72rem;letter-spacing:0}

/* hero */
.hero{position:relative;min-height:100svh;background:#050507;color:#f2f4f6;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;padding:110px 20px 90px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(169,189,208,.14),transparent 60%)}
.hero h1{position:relative;font-family:var(--brut);font-weight:900;text-transform:uppercase;font-size:min(24vw,23rem);line-height:.82;letter-spacing:-.01em;
 background:linear-gradient(100deg,#59616c 0%,#59616c 30%,#fff 45%,#fff 55%,#59616c 70%,#59616c 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
 animation:reveal 1.3s cubic-bezier(.7,0,.2,1) both,sweep 7s ease-in-out 1.3s infinite}
@keyframes reveal{from{clip-path:inset(0 0 100% 0);transform:translateY(40px)}to{clip-path:inset(0);transform:none}}
@keyframes sweep{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.hero p{position:relative;margin-top:34px;font-size:.95rem;letter-spacing:.35em;color:var(--ice);animation:fade 1s ease 1.2s both}
.go{position:relative;display:inline-block;margin-top:44px;padding:18px 48px;border:1px solid #fff;color:#fff;font-size:.8rem;letter-spacing:.3em;transition:.4s;text-decoration:none;animation:fade 1s ease 1.5s both}
.go:hover{background:#fff;color:#000}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hline{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:28px;display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.3em;color:#8b95a1;border-top:1px solid #2a2e35;padding-top:16px}

/* menu */
.menu{max-width:1180px;margin:0 auto;padding:110px clamp(20px,4vw,56px) 40px}
.menu-h{font-family:var(--brut);font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,7vw,5.5rem);line-height:.95;max-width:14ch}
.menu-s{margin-top:16px;color:var(--mute);max-width:46ch;line-height:1.7}
.cuis{display:flex;gap:clamp(24px,5vw,64px);margin:64px 0 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cui{font-family:var(--brut);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5vw,3.6rem);color:#aab0b8;padding-bottom:14px;margin-bottom:-1px;border-bottom:1px solid transparent;transition:.3s}
.cui:hover{color:var(--ink)}
.cui.on{color:var(--ink);border-bottom-color:var(--ink)}
.tags{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:36px}
.tag{font-size:.9rem;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent;transition:.3s}
.tag:hover{color:var(--ink)}
.tag.on{color:var(--ink);border-bottom-color:var(--ice)}
.group{margin-bottom:56px}
.group>h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.5rem;color:var(--mute);margin-bottom:6px}
.dish{display:grid;grid-template-columns:1fr auto auto;gap:8px 28px;align-items:baseline;padding:22px 0;border-top:1px solid var(--line)}
.dish:last-child{border-bottom:1px solid var(--line)}
.dish h4{font-family:var(--serif);font-weight:400;font-size:clamp(1.35rem,2.4vw,1.8rem);line-height:1.15}
.dish p{grid-column:1;color:var(--mute);line-height:1.6;font-size:.95rem;max-width:60ch}
.dish .w{grid-column:1;font-size:.8rem;color:#9aa1aa}
.price{grid-column:2;grid-row:1;font-size:1.1rem;font-weight:400;white-space:nowrap}
.add{grid-column:3;grid-row:1;width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;font-size:1.2rem;line-height:1;transition:.3s;display:grid;place-items:center}
.add:hover,.add.ok{background:var(--ink);color:var(--white)}

footer{max-width:1180px;margin:60px auto 0;padding:40px clamp(20px,4vw,56px);border-top:1px solid var(--line);color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* cart */
.fab{display:none}
.modal{position:fixed;inset:0;background:rgba(5,5,7,.55);backdrop-filter:blur(4px);display:flex;justify-content:flex-end;z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
.modal.open{opacity:1;pointer-events:auto}
.drawer{width:100%;max-width:440px;height:100%;background:var(--white);padding:32px;display:flex;flex-direction:column;transform:translateX(30px);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.modal.open .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--serif);font-weight:400;font-size:2rem}
.x{width:36px;height:36px;border:1px solid var(--line);border-radius:50%}
.c-list{flex:1;overflow-y:auto;padding:8px 0}
.c-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.c-item b{font-family:var(--serif);font-weight:400;font-size:1.2rem;display:block}
.c-item small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:12px}
.q{width:30px;height:30px;border:1px solid var(--line);border-radius:50%}
.q:hover{border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);margin-top:60px}
.d-foot{padding-top:20px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.7rem;margin-bottom:18px}
.order{width:100%;padding:18px;background:var(--ink);color:var(--white);letter-spacing:.25em;font-size:.8rem;transition:.3s;border:1px solid var(--ink)}
.order:hover{background:none;color:var(--ink)}
#msg{margin-top:14px;color:var(--mute);font-size:.9rem;min-height:1.2em}

@media(max-width:600px){
 .dish{grid-template-columns:1fr auto}
 .price{grid-column:2;grid-row:1}
 .add{grid-column:2;grid-row:2;justify-self:end}
 .dish .w{grid-row:3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:40px;align-items:start}
@media(max-width:800px){.two{grid-template-columns:1fr;gap:28px}}
.lbl{font-size:.8rem;color:var(--mute);margin:24px 0 10px}.lbl:first-child{margin-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);padding:10px 16px;font-size:.9rem;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}

.fld:focus{border-bottom-color:var(--ice)}
.step{display:inline-flex;gap:16px;align-items:center;font-size:1.2rem}
.step button{width:36px;height:36px;border:1px solid var(--ink);border-radius:50%}
.cta{margin:26px 10px 0 0;padding:16px 30px;background:var(--ink);color:var(--white);letter-spacing:.22em;font-size:.75rem;border:1px solid var(--ink);transition:.3s}
.cta:hover{background:none;color:var(--ink)}
.cta.alt{background:none;color:var(--ink)}.cta.alt:hover{background:var(--ink);color:var(--white)}
.note{margin-top:16px;color:var(--mute);font-size:.9rem;min-height:1.3em}
.gift{background:#050507;color:#f2f4f6;padding:30px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #2a2e35}
.gift .amt{font-family:var(--brut);font-weight:900;font-size:clamp(3.5rem,9vw,6rem);line-height:.9;background:linear-gradient(100deg,#6c7480,#fff,#6c7480);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.gift .br{font-family:var(--brut);font-weight:900;letter-spacing:.3em;font-size:1rem;color:#a9bdd0}
.gift .to{font-family:var(--serif);font-size:1.5rem}.gift .m{font-size:.9rem;color:#8b95a1;margin-top:6px;line-height:1.5}
.pair{grid-column:1;font-size:.85rem;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pair b{font-weight:400;color:var(--ink)}
.pair button{border:1px solid var(--line);padding:3px 10px;font-size:.75rem;transition:.2s}
.pair button:hover{border-color:var(--ink)}

.chk{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:.9rem}.chk b{margin-left:auto;font-weight:400}
.dish.stop{opacity:.4}.dish.stop .add{pointer-events:none}
.rev{padding:18px 0;border-top:1px solid var(--line);display:flex;gap:16px}
.rev img,.rev .av{width:52px;height:52px;object-fit:cover;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.st{color:var(--ice);letter-spacing:2px}
.trk{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:.9rem}.trk span{color:var(--mute)}.trk span.on{color:var(--ink)}
.bar{height:3px;background:#2a2e35;margin:12px 0}.bar i{display:block;height:3px;background:#a9bdd0}
.adt{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:16px}.adt td{padding:8px 6px;border-top:1px solid var(--line)}
.adt input[type=number]{width:90px;background:none;border:1px solid var(--line);color:var(--ink);padding:5px}

function render(){

  $('cuis').innerHTML=['ru','it'].map(k=>`<button class="cui ${k===cat?'on':''}" onclick="cat='${k}';tag='Все';render()">${t(k)}</button>`).join('');

  $('diets').innerHTML=['g','l','v','s'].map(k=>`<button class="chip ${df[k]?'on':''}" onclick="df.${k}=!df.${k};render()">${t('df_'+k)}</button>`).join('');
  $('dnote').textContent=Object.values(df).some(Boolean)?t('d_note'):'';
  const shown=items.filter(x=>(!df.g||x.g)&&(!df.l||x.l)&&(!df.v||x.v)&&(!df.s||x.s));
  const groups=[...new Set(shown.map(x=>x.t))].filter(g=>tag==='Все'||g===tag);
  $('list').innerHTML=groups.map(g=>`<div class="group"><h3>${t(g)}</h3>${shown.filter(x=>x.t===g).map(x=>`<div class="dish ${x.stop?'stop':''}"><h4>${x[L]}</h4><span class="price">${x.stop?t('stop'):fmt(x.p)}</span><button class="add" onclick="addDish(${x.id},this)" aria-label="+">+</button>${L==='ru'?`<p>${x.d}</p>`:''}<span class="w">${L==='ru'?x.w:x.w.replace('г','g')}</span><div class="pair">${t('pair')}: <b>${x.dr}</b> ${fmt(x.dp)}<button onclick="addDrink(${x.id})">${t('glass')}</button></div></div>`).join('')}</div>`).join('')||`<p class="note">—</p>`;

function put(o){const f=cart.find(x=>x.id===o.id);f?f.q++:cart.push({...o,q:1});$('msg').textContent='';upd()}
function addDish(id,b){const x=DATA.find(d=>d.id===id);put({id:'d'+id,p:x.p,ru:x.ru,en:x.en});if(b){b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),500)}}

function upd(){
  const c=calc();
  $('cnt').textContent=cart.reduce((a,x)=>a+x.q,0);
  $('tot').textContent=fmt(c.total);
  $('dfee').textContent=c.del?(c.fee?fmt(c.fee):t('free')):'';
  $('clist').innerHTML=cart.length?cart.map(x=>`<div class="c-item"><div><b>${x[L]}</b><small>${fmt(x.p*x.q)}</small></div><div class="qty"><button class="q" onclick="chg('${x.id}',-1)">−</button><span>${x.q}</span><button class="q" onclick="chg('${x.id}',1)">+</button></div></div>`).join(''):`<p class="empty">${t('empty')}</p>`;

function toggleCart(){$('modal').classList.toggle('open')}

  pay(c.total,()=>{
    LY.pts+=Math.round(c.total*(LY.spent>=30000?.1:.05));LY.spent+=c.total;sv('ms_loy',JSON.stringify(LY));drawLoy();

}

const jp=(k,d)=>{try{return JSON.parse(ld(k))||d}catch(e){return d}},esc=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),PIN='1234';

let AC,snd=false,pad,lastDish=null;
function mkPad(){const g=AC.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.05,AC.currentTime+3);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;f.connect(g);g.connect(AC.destination);
 const os=[110,164.8,220,277.2].map((hz,i)=>{const o=AC.createOscillator();o.type=i%2?'sine':'triangle';o.frequency.value=hz;o.detune.value=i*4;o.connect(f);o.start();return o});
 const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.08;lg.gain.value=300;l.connect(lg);lg.connect(f.frequency);l.start();
 return{stop(){g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(g.gain.value,AC.currentTime);g.gain.linearRampToValueAtTime(0,AC.currentTime+1);setTimeout(()=>{os.forEach(o=>o.stop());l.stop()},1100)}}}
function toggleSound(){snd=!snd;$('snd').style.opacity=snd?1:.5;if(snd){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();pad=mkPad()}else if(pad)pad.stop()}
function clink(){const t0=AC.currentTime;[2093,3136].forEach((hz,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=hz;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.06/(i+1),t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+1.2);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+1.3)})}
document.addEventListener('mouseover',e=>{const d=e.target.closest&&e.target.closest('.dish');if(d&&d!==lastDish&&snd)clink();lastDish=d});

function putN(o,n){const f=cart.find(x=>x.id===o.id);f?f.q+=n:cart.push({...o,q:n});upd()}
let bd={g:2,b:3500,c:'ru',pick:null};
function mkDinner(){
  const P=x=>x.c===bd.c&&!x.stop,S=DATA.filter(x=>P(x)&&x.t==='Закуски'),M=DATA.filter(x=>P(x)&&['Горячее','Паста','Пицца'].includes(x.t)),D=DATA.filter(x=>P(x)&&x.t==='Десерты'),all=[];
  S.forEach(a=>M.forEach(m=>D.forEach(d=>{const tot=a.p+m.p+d.p+m.dp;if(tot<=bd.b)all.push({s:a,m,d,tot})})));
  all.sort((a,b)=>b.tot-a.tot);return all.length?all[Math.floor(Math.random()*Math.min(5,all.length))]:null}
const brow=(a,b,c)=>`<div class="dish" style="grid-template-columns:1fr auto"><div><div style="font-size:.8rem;color:var(--mute)">${a}</div><h4>${b}</h4></div><span class="price" style="grid-column:2">${fmt(c)}</span></div>`;
function drawBuild(){
  $('bdg').textContent=bd.g;
  $('bdb').innerHTML=[2000,3500,5000,8000].map(b=>`<button class="chip ${b===bd.b?'on':''}" onclick="bd.b=${b};bd.pick=null;drawBuild()">${fmt(b)}</button>`).join('');
  $('bdc').innerHTML=['ru','it'].map(k=>`<button class="chip ${k===bd.c?'on':''}" onclick="bd.c='${k}';bd.pick=null;drawBuild()">${t(k)}</button>`).join('');
  if(!bd.pick)bd.pick=mkDinner();const p=bd.pick;
  $('bdr').innerHTML=p?[['bd_s1',p.s],['bd_m',p.m],['bd_d',p.d]].map(([r,x])=>brow(t(r),x[L],x.p)).join('')+brow(t('bd_w'),p.m.dr,p.m.dp)+`<div class="tot" style="margin-top:20px"><span>${t('bd_tot')} (${bd.g})</span><span>${fmt(p.tot*bd.g)}</span></div><button class="cta" style="margin-top:0" onclick="bdAdd()">${t('bd_add')}</button>`:`<p class="note">${t('bd_none')}</p>`;
}
function bdg(d){bd.g=Math.min(8,Math.max(1,bd.g+d));drawBuild()}
function bdAdd(){const p=bd.pick;[p.s,p.m,p.d].forEach(x=>putN({id:'d'+x.id,p:x.p,ru:x.ru,en:x.en},bd.g));putN({id:'w'+p.m.id,p:p.m.dp,ru:p.m.dr,en:p.m.dr},bd.g);toggleCart()}

function ics(title,d,min){const p=n=>String(n).padStart(2,'0'),f=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`,e=new Date(d.getTime()+min*6e4);
  const c=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MIROSLIME//EN\r\nBEGIN:VEVENT\r\nUID:${Date.now()}@miroslime\r\nDTSTAMP:${f(new Date())}\r\nDTSTART:${f(d)}\r\nDTEND:${f(e)}\r\nSUMMARY:${title}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/calendar'}));a.download='miroslime.ics';a.click()}
function bookIcs(){const [h,m]=bk.t.split(':'),d=new Date(days[bk.d]);d.setHours(+h,+m,0,0);ics('MIROSLIME',d,120)}

const EV=[{id:1,d:'2026-12-05T20:00',ru:'Дегустационный вечер: Россия и Италия',en:'Tasting night: Russia meets Italy',p:6900,s:12},{id:2,d:'2026-12-12T21:00',ru:'Живая музыка: джаз и бокал вина',en:'Live music: jazz and a glass of wine',p:2500,s:30},{id:3,d:'2026-12-19T15:00',ru:'Мастер-класс шефа: пельмени и паста',en:'Chef masterclass: pelmeni and pasta',p:4500,s:10}];

function evTap(id){const e=EV.find(x=>x.id===id);if(EG.includes(id))ics(e[L],new Date(e.d),180);else{EG.push(id);sv('ms_ev',JSON.stringify(EG));drawEvents()}}

  $('rst').innerHTML=[1,2,3,4,5].map(i=>`<button class="chip ${i===rs?'on':''}" onclick="rs=${i};drawRev()">${i} ★</button>`).join('');

function pickPh(i){const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rph=c.toDataURL('image/jpeg',.7)};im.src=fr.result};fr.readAsDataURL(f)}

let adm=false;
